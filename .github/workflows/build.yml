name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m compileall -q src
      - run: python -m pip install trove-classifiers && python -c "import tomllib;from trove_classifiers import classifiers as C;b=[c for c in tomllib.load(open('pyproject.toml','rb'))['project']['classifiers'] if c not in C];assert not b,b"
      - run: python -m build
      - run: python -m pip install dist/*.whl && microheart --help
